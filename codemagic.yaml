workflows:
  lanmirror:
    name: LanMirror Unsigned IPA
    environment:
      xcode: latest

    scripts:
      - name: Build unsigned
        script: |
          set -e
          rm -rf build Payload LanMirror.ipa

          xcodebuild \
            -project LanMirror.xcodeproj \
            -scheme LanMirror \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Validate app executables
        script: |
          set -e
          APP="build/Build/Products/Release-iphoneos/LanMirror.app"
          EXT="$APP/PlugIns/BroadcastUpload.appex"

          test -d "$APP"
          test -d "$EXT"

          APP_EXEC=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Info.plist")
          EXT_EXEC=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$EXT/Info.plist")

          echo "Main executable: $APP_EXEC"
          echo "Extension executable: $EXT_EXEC"

          test -n "$APP_EXEC"
          test -n "$EXT_EXEC"
          test -f "$APP/$APP_EXEC"
          test -f "$EXT/$EXT_EXEC"

      - name: Package unsigned signable IPA
        script: |
          set -e
          APP="build/Build/Products/Release-iphoneos/LanMirror.app"

          rm -rf Payload LanMirror.ipa
          mkdir -p Payload
          cp -R "$APP" Payload/LanMirror.app

          find Payload -name _CodeSignature -type d -prune -exec rm -rf {} + || true
          find Payload -name embedded.mobileprovision -type f -delete || true

          /usr/bin/zip -qry LanMirror.ipa Payload
          /usr/bin/unzip -t LanMirror.ipa

    artifacts:
      - LanMirror.ipa
      - build/Build/Products/Release-iphoneos/LanMirror.app
