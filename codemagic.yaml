workflows:
  lanmirror:
    name: LanMirror Unsigned IPA

    environment:
      xcode: latest

    scripts:
      - name: Build unsigned
        script: |
          rm -rf build Payload LanMirror.ipa

          xcodebuild \
            -project LanMirror.xcodeproj \
            -scheme LanMirror \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Prepare signable IPA
        script: |
          APP="build/Build/Products/Release-iphoneos/LanMirror.app"

          rm -rf "$APP/_CodeSignature"
          rm -f "$APP/embedded.mobileprovision"

          if [ -d "$APP/PlugIns" ]; then
            find "$APP/PlugIns" -name "_CodeSignature" -type d -prune -exec rm -rf {} \;
            find "$APP/PlugIns" -name "embedded.mobileprovision" -type f -delete
          fi

          mkdir -p Payload
          cp -R "$APP" Payload/LanMirror.app

          zip -qry LanMirror.ipa Payload

    artifacts:
      - LanMirror.ipa
