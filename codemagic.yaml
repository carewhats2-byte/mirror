workflows:
  lanmirror:
    name: LanMirror Compile
    environment:
      xcode: latest

    scripts:
      - name: Compile
        script: |
          xcodebuild \
            -project LanMirror.xcodeproj \
            -scheme LanMirror \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Make IPA
        script: |
          mkdir -p Payload
          cp -R build/Build/Products/Debug-iphoneos/LanMirror.app Payload/
          zip -r LanMirror.ipa Payload

    artifacts:
      - LanMirror.ipa
      - build/Build/Products/Debug-iphoneos/LanMirror.app
